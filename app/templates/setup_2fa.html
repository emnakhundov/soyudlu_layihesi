{% extends "base.html" %}
{% block title %}2FA quraşdırma{% endblock %}
{% block content %}
<div class="card" style="max-width:520px;margin:30px auto">
  <h2>İki faktorlu doğrulama (2FA)</h2>
  <p>Microsoft Authenticator və ya Google Authenticator ilə QR kodu skan edin, və ya açarı əl ilə daxil edin.</p>
  <img src="{{ qr }}" alt="QR kod" width="220">
  <p>Açar: <code>{{ secret }}</code></p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Authenticator-dakı 6 rəqəmli kod</label>
    <input name="code" inputmode="numeric" maxlength="6" required autofocus>
    <button type="submit">Təsdiqlə və aktivləşdir</button>
  </form>
</div>
{% endblock %}
